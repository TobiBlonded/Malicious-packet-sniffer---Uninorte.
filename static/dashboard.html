<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defensor ESP32</title><style>
:root{--bg:#07111f;--card:#101e31;--line:#29415f;--text:#e8f0fb;--muted:#94a8c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#12355a,#07111f 45%);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:30px 20px}header,.top{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{margin:0;font-size:30px}.sub,.meta,small{color:var(--muted)}.status{color:#ffc857;font-weight:700}.online{color:#5ee59a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.card,.event{background:rgba(16,30,49,.94);border:1px solid var(--line);border-radius:13px;padding:16px}.label{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.number{font-size:29px;font-weight:750}.toolbar{margin:16px 0}.toolbar select{background:var(--card);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:8px}.feed{display:grid;gap:11px}.event{border-left:4px solid #64748b}.event.ALTO{border-left-color:#fb923c}.event.CRITICO,.event.ERROR{border-left-color:#fb4f68}.event.BAJO{border-left-color:#55d68d}.badge{padding:5px 9px;border-radius:99px;background:#334155;font-size:12px;font-weight:800}.badge.ALTO{background:#9a3412}.badge.CRITICO,.badge.ERROR{background:#9f1239}.badge.BAJO{background:#166534}.analysis{white-space:pre-wrap;line-height:1.55;margin:12px 0 0}.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{display:block}.status{display:block;margin-top:12px}}</style></head><body><div class="wrap"><header><div><h1>Defensor ESP32</h1><p class="sub">Monitor Wi-Fi y clasificacion asistida por IA</p></div><span id="status" class="status">Conectando...</span></header><section class="grid"><div class="card"><div class="label">Eventos</div><div id="total" class="number">0</div></div><div class="card"><div class="label">Criticos</div><div id="criticos" class="number">0</div></div><div class="card"><div class="label">Alto riesgo</div><div id="altos" class="number">0</div></div><div class="card"><div class="label">En analisis</div><div id="pendientes" class="number">0</div></div></section><div class="toolbar">Filtrar: <select id="filtro"><option value="TODOS">Todos los niveles</option><option>CRITICO</option><option>ALTO</option><option>MEDIO</option><option>BAJO</option><option>PENDIENTE</option><option>ERROR</option></select></div><main id="feed" class="feed"></main></div><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let events=[];function render(){const f=$('filtro').value,view=events.filter(e=>f==='TODOS'||e.nivel===f);$('feed').innerHTML=view.length?view.map(e=>{const d=e.evento,t=e.estado==='pendiente'?'Analizando con IA...':e.analisis||e.detalle_error||'Sin resultado';return `<article class="event ${esc(e.nivel)}"><div class="top"><div><span class="badge ${esc(e.nivel)}">${esc(e.nivel)}</span> <b>${esc(d.tipo)}</b></div><small>${new Date(e.recibido_en).toLocaleString()}</small></div><div class="meta">Origen ${esc(d.mac_origen)} · BSSID ${esc(d.bssid_objetivo)} · ${esc(d.paquetes_por_segundo)} PPS · Canal ${esc(d.canal)}</div><div class="analysis">${esc(t)}</div></article>`}).join(''):'<div class="empty">No hay eventos para este filtro.</div>'}async function sync(){try{const[a,b]=await Promise.all([fetch('/eventos',{cache:'no-store'}),fetch('/resumen',{cache:'no-store'})]);events=await a.json();const s=await b.json();['total','criticos','altos','pendientes'].forEach(k=>$(k).textContent=s[k]??0);$('status').textContent='● Servidor conectado';$('status').className='status online';render()}catch{$('status').textContent='Servidor no disponible';$('status').className='status'}}$('filtro').onchange=render;sync();setInterval(sync,2000);</script></body></html>
