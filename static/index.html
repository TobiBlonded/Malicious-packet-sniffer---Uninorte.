<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defensor ESP32</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e5edf9}body{max-width:1120px;margin:auto;padding:28px 18px}h1{margin:0;font-size:1.8rem}.sub{color:#9fb0c8;margin:6px 0 26px}#estado{float:right;color:#fbbf24}.online{color:#4ade80!important}.resumen{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.tarjeta{background:#162136;border:1px solid #293a57;border-radius:10px;padding:14px;min-width:130px}.tarjeta b{display:block;font-size:1.5rem}table{width:100%;border-collapse:collapse;background:#111c2e;border-radius:10px;overflow:hidden}th,td{padding:13px;text-align:left;border-bottom:1px solid #263652;vertical-align:top}th{color:#9fb0c8;font-size:.78rem;text-transform:uppercase}.nivel{font-weight:700;padding:4px 8px;border-radius:99px;font-size:.76rem}.BAJO{background:#14532d}.MEDIO{background:#854d0e}.ALTO{background:#9a3412}.CRITICO,.ERROR{background:#991b1b}.PENDIENTE,.SIN_CLASIFICAR{background:#334155}.detalle{max-width:410px;white-space:pre-wrap;color:#cbd5e1}.pendiente{color:#fbbf24}@media(max-width:700px){th:nth-child(3),td:nth-child(3){display:none}table{font-size:.86rem}}</style></head><body>
<span id="estado">Conectando…</span><h1>Defensor ESP32</h1><p class="sub">Eventos de red detectados y clasificados en tiempo real.</p><section class="resumen"><div class="tarjeta">Total<b id="total">0</b></div><div class="tarjeta">Críticos<b id="criticos">0</b></div><div class="tarjeta">En cola<b id="pendientes">0</b></div></section><table><thead><tr><th>Hora</th><th>Nivel</th><th>Evento</th><th>Origen</th><th>Análisis IA</th></tr></thead><tbody id="filas"><tr><td colspan="5">Esperando eventos del ESP32…</td></tr></tbody></table><script>
const eventos=new Map(),filas=document.querySelector('#filas'),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){const l=[...eventos.values()].sort((a,b)=>b.recibido_en.localeCompare(a.recibido_en));total.textContent=l.length;criticos.textContent=l.filter(e=>e.nivel==='CRITICO').length;pendientes.textContent=l.filter(e=>e.estado==='pendiente').length;filas.innerHTML=l.length?l.map(e=>{const d=e.evento;return `<tr><td>${new Date(e.recibido_en).toLocaleTimeString()}</td><td><span class="nivel ${esc(e.nivel)}">${esc(e.nivel)}</span></td><td>${esc(d.tipo)}<br><small>${esc(d.paquetes_por_segundo)} pps · canal ${esc(d.canal)}</small></td><td>${esc(d.mac_origen)}<br><small>${esc(d.bssid_objetivo)}</small></td><td class="detalle ${e.estado==='pendiente'?'pendiente':''}">${esc(e.estado==='pendiente'?'Analizando…':e.analisis||e.detalle_error)}</td></tr>`}).join(''):'<tr><td colspan="5">Esperando eventos del ESP32…</td></tr>'}function conectar(){const w=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);w.onopen=()=>{estado.textContent='● En tiempo real';estado.className='online'};w.onclose=()=>{estado.textContent='Reconectando…';estado.className='';setTimeout(conectar,2000)};w.onmessage=({data})=>{const m=JSON.parse(data);if(m.tipo==='estado_inicial')m.eventos.forEach(e=>eventos.set(e.id,e));else eventos.set(m.evento.id,m.evento);render()}}conectar();</script></body></html>
